<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - PhoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold">📱 PhoneStore</h3>
            <p class="text-muted">Tạo tài khoản mới</p>
        </div>
        
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Nhập địa chỉ email" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Tạo mật khẩu" required>
            </div>
            
            <button type="submit" class="btn btn-success w-100 fw-bold">Đăng Ký</button>
            
            <div class="text-center mt-3">
                <span>Đã có tài khoản? <a href="login.html" class="text-decoration-none">Đăng nhập</a></span>
                <hr>
                <a href="index.html" class="text-decoration-none text-secondary">🏠 Về trang chủ</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Ngăn form reload trang
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                
                const result = await response.json();
                alert(result.message); // Hiển thị thông báo từ backend
                
                if(result.status === 'success') {
                    window.location.href = 'login.html'; // Đăng ký thành công chuyển sang trang login
                }
            } catch (error) {
                console.error('Lỗi:', error);
                alert('Không thể kết nối đến máy chủ!');
            }
        });
    </script>
</body>
</html>
