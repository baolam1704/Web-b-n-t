<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Điện Thoại - PhoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">📱 PhoneStore Group 2</a>
            <div class="d-flex" id="auth-buttons">
                <a href="register.html" class="btn btn-success me-2">Đăng ký</a>
                <a href="login.html" class="btn btn-primary me-2">Đăng nhập</a>
                <button class="btn btn-outline-light position-relative" type="button" onclick="openCartModal()">
                    🛒 Giỏ hàng <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div id="login-warning" class="container mt-3" style="display: none;">
        <div class="alert alert-warning text-center shadow-sm mb-0" role="alert">
            ⚠️ Bạn cần <a href="login.html" class="alert-link fw-bold">Đăng nhập</a> hoặc <a href="register.html" class="alert-link fw-bold">Đăng ký</a> để có thể thêm sản phẩm vào giỏ hàng và mua hàng!
        </div>
    </div>

    <div class="container my-4">
        <h2 class="mb-4 text-center">Danh Sách Điện Thoại Nổi Bật</h2>
        <div class="row" id="product-list">
        </div>
    </div>

    <div class="modal fade" id="cartModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">🛒 Giỏ Hàng Của Bạn</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Sản phẩm</th>
                                    <th>Đơn giá</th>
                                    <th class="text-center">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items-body"></tbody>
                        </table>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3 border-top pt-3">
                        <h5 class="fw-bold mb-0">Tổng tiền: <span id="cart-total" class="text-danger">0 đ</span></h5>
                        <button class="btn btn-success fw-bold" onclick="checkout()">Thanh Toán Ngay</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const username = localStorage.getItem('username');
            const authContainer = document.getElementById('auth-buttons');
            const warningBanner = document.getElementById('login-warning');
            
            if (username) {
                authContainer.innerHTML = `
                    <span class="text-white align-self-center me-3">👤 Xin chào, <strong>${username}</strong></span>
                    <button onclick="logout()" class="btn btn-outline-danger me-2">Đăng xuất</button>
                    <button class="btn btn-outline-light position-relative" type="button" onclick="openCartModal()">
                        🛒 Giỏ hàng <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
                    </button>
                `;
                if (warningBanner) warningBanner.style.display = 'none';
            } else {
                if (warningBanner) warningBanner.style.display = 'block';
            }
            
            renderProducts();
            updateCartCount();
        });

        function logout() {
            localStorage.clear();
            window.location.reload();
        }

        function renderProducts() {
            // Danh sách sản phẩm tích hợp sẵn hình ảnh thực tế
            const defaultProducts = [
                { 
                    name: 'iPhone 15 Pro Max', 
                    price: 28990000, 
                    image: 'https://bhstore.vn/uploads/iphone-15-promax-bhstore_3_1731640873.png' 
                },
                { 
                    name: 'Samsung Galaxy S24 Ultra', 
                    price: 26990000, 
                    image: 'https://www.didongmy.com/vnt_upload/product/01_2024/thumbs/(600x600)_samsung_galaxy_s24_ultra_5g_tim_didongmy_thumb_600x600_1_3.jpg' 
                },
                { 
                    name: 'Xiaomi 17 Pro', 
                    price: 18990000, 
                    image: 'https://cdn.hstatic.net/products/200000547251/promx_05cef000dabe4d3cad0318ed8ad6ec47_master.png' 
                }
            ];

            if (!localStorage.getItem('store_products')) {
                localStorage.setItem('store_products', JSON.stringify(defaultProducts));
            }

            let products = JSON.parse(localStorage.getItem('store_products')) || defaultProducts;
            const productList = document.getElementById('product-list');
            productList.innerHTML = '';

            products.forEach(prod => {
                // Nếu sản phẩm chưa có ảnh, gán ảnh mặc định
                let imgSrc = prod.image || 'https://via.placeholder.com/300x200';
                productList.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card h-100 shadow-sm">
                            <img src="${imgSrc}" class="card-img-top p-3" alt="${prod.name}" style="height: 250px; object-fit: contain;">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${prod.name}</h5>
                                <p class="card-text text-danger fw-bold">${prod.price.toLocaleString('vi-VN')} đ</p>
                                <button class="btn btn-primary mt-auto" onclick="addToCart('${prod.name}', ${prod.price})">Thêm vào giỏ hàng</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(productName, price) {
            const username = localStorage.getItem('username');
            if (!username) {
                alert('⚠️ Vui lòng đăng nhập trước khi thêm sản phẩm vào giỏ hàng!');
                window.location.href = 'login.html';
                return;
            }

            let cartKey = 'cart_' + username;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            cart.push({ productName, price });
            localStorage.setItem(cartKey, JSON.stringify(cart));

            updateCartCount();
            alert('Đã thêm "' + productName + '" vào giỏ hàng thành công!');
        }

        function updateCartCount() {
            const username = localStorage.getItem('username');
            if (!username) {
                document.getElementById('cart-count').innerText = 0;
                return;
            }
            let cart = JSON.parse(localStorage.getItem('cart_' + username)) || [];
            document.getElementById('cart-count').innerText = cart.length;
        }

        function openCartModal() {
            const username = localStorage.getItem('username');
            if (!username) {
                alert('Vui lòng đăng nhập để xem giỏ hàng!');
                window.location.href = 'login.html';
                return;
            }

            let cartKey = 'cart_' + username;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            const tbody = document.getElementById('cart-items-body');
            tbody.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-4">Giỏ hàng của bạn đang trống!</td></tr>`;
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-semibold">${item.productName}</td>
                            <td class="text-danger fw-bold">${item.price.toLocaleString('vi-VN')} đ</td>
                            <td class="text-center">
                                <button class="btn btn-outline-danger btn-sm" onclick="removeItem(${index})">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            }

            document.getElementById('cart-total').innerText = total.toLocaleString('vi-VN') + ' đ';
            var myModal = new bootstrap.Modal(document.getElementById('cartModal'));
            myModal.show();
        }

        function removeItem(index) {
            const username = localStorage.getItem('username');
            let cartKey = 'cart_' + username;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            cart.splice(index, 1);
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartCount();
            openCartModal();
        }

        function checkout() {
            const username = localStorage.getItem('username');
            let cartKey = 'cart_' + username;
            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

            if (cart.length === 0) {
                alert('Giỏ hàng trống, không thể thanh toán!');
                return;
            }

            let total = cart.reduce((sum, item) => sum + item.price, 0);
            let productNames = cart.map(item => item.productName).join(', ');

            let adminOrders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            let newOrder = {
                id: '#ORD' + Math.floor(100 + Math.random() * 900),
                customer: username,
                product: productNames,
                price: total,
                status: 'Chờ xác nhận'
            };
            adminOrders.push(newOrder);
            localStorage.setItem('admin_orders', JSON.stringify(adminOrders));

            alert('🎉 Thanh toán thành công! Đơn hàng đã được gửi đến trang Admin.');
            localStorage.removeItem(cartKey);
            updateCartCount();
            
            var modalEl = document.getElementById('cartModal');
            var modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
        }
    </script>
</body>
</html>
