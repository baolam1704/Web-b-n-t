<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Điện Thoại - PhoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">📱 PhoneStore Group 2</a>
            <!-- Thêm id="auth-buttons" vào đây để JavaScript dễ quản lý -->
            <div class="d-flex" id="auth-buttons">
                <a href="register.html" class="btn btn-success me-2">Đăng ký</a>
                <a href="login.html" class="btn btn-primary me-2">Đăng nhập</a>
                
                <button class="btn btn-outline-light" type="button">
                    🛒 Giỏ hàng <span class="badge bg-danger" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-4 text-center">Danh Sách Điện Thoại Nổi Bật</h2>
        <div class="row" id="product-list">
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Phone">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">iPhone 15 Pro Max</h5>
                        <p class="card-text text-danger fw-bold">28.990.000 đ</p>
                        <button class="btn btn-primary mt-auto" onclick="addToCart('iPhone 15 Pro Max')">Thêm vào giỏ hàng</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Phone">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Samsung Galaxy S24 Ultra</h5>
                        <p class="card-text text-danger fw-bold">26.990.000 đ</p>
                        <button class="btn btn-primary mt-auto" onclick="addToCart('Samsung Galaxy S24 Ultra')">Thêm vào giỏ hàng</button>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Phone">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">Xiaomi 14 Pro</h5>
                        <p class="card-text text-danger fw-bold">18.990.000 đ</p>
                        <button class="btn btn-primary mt-auto" onclick="addToCart('Xiaomi 14 Pro')">Thêm vào giỏ hàng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kiểm tra xem đã đăng nhập chưa khi mở trang chủ
        window.addEventListener('DOMContentLoaded', function() {
            const username = localStorage.getItem('username');
            const authContainer = document.getElementById('auth-buttons');
            
            if (username) {
                // Nếu đã đăng nhập, đổi nút Đăng nhập/Đăng ký thành lời chào và nút Đăng xuất
                authContainer.innerHTML = `
                    <span class="text-white align-self-center me-3">👤 Xin chào, <strong>${username}</strong></span>
                    <button onclick="logout()" class="btn btn-outline-danger me-2">Đăng xuất</button>
                    <button class="btn btn-outline-light" type="button">
                        🛒 Giỏ hàng <span class="badge bg-danger" id="cart-count">0</span>
                    </button>
                `;
            }
        });

        // Hàm xử lý đăng xuất
        function logout() {
            localStorage.clear(); // Xóa sạch thông tin đăng nhập
            window.location.reload(); // Tải lại trang
        }

        let cartCount = 0;
        function addToCart(productName) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert('Đã thêm "' + productName + '" vào giỏ hàng!');
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
