<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - PhoneStore Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">🛠️ PhoneStore Admin Panel</a>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">👤 Xin chào, <strong>Admin</strong></span>
                <a href="index.html" class="btn btn-outline-light btn-sm">🏠 Về trang chủ</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="mb-4 fw-bold text-secondary">Quản Lý Đơn Hàng & Hệ Thống</h2>
        
        <div class="row text-white">
            <div class="col-md-4 mb-3">
                <div class="card bg-primary shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="card-title text-uppercase fw-semibold">Tổng số đơn hàng</h6>
                        <h3 id="total-orders" class="fw-bold">1</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-success shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="card-title text-uppercase fw-semibold">Doanh thu tạm tính</h6>
                        <h3 id="total-revenue" class="fw-bold">28.990.000 đ</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card bg-warning text-dark shadow-sm border-0">
                    <div class="card-body">
                        <h6 class="card-title text-uppercase fw-semibold">Sản phẩm trong kho</h6>
                        <h3 class="fw-bold">3</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mt-4 border-0">
            <div class="card-header bg-white py-3 fw-bold text-dark">📋 Danh sách đơn hàng cần duyệt</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID Đơn</th>
                                <th>Khách hàng</th>
                                <th>Sản phẩm</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th class="text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="order-table-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu ban đầu cho đơn hàng
        let orders = [
            { id: '#101', customer: 'nhomtruong', product: 'iPhone 15 Pro Max', price: 28990000, status: 'Chờ xác nhận' }
        ];

        function renderOrders() {
            const tbody = document.getElementById('order-table-body');
            tbody.innerHTML = '';
            
            let activeOrdersCount = 0;
            let revenue = 0;

            orders.forEach((order, index) => {
                if (order.status !== 'Đã hủy') {
                    activeOrdersCount++;
                    if (order.status === 'Đã duyệt') {
                        revenue += order.price;
                    }
                }

                let badgeClass = 'bg-warning text-dark';
                if (order.status === 'Đã duyệt') badgeClass = 'bg-success';
                if (order.status === 'Đã hủy') badgeClass = 'bg-danger';

                const row = `
                    <tr>
                        <td class="fw-bold">${order.id}</td>
                        <td>${order.customer}</td>
                        <td>${order.product}</td>
                        <td class="text-danger fw-bold">${order.price.toLocaleString('vi-VN')} đ</td>
                        <td><span class="badge ${badgeClass}">${order.status}</span></td>
                        <td class="text-center">
                            ${order.status === 'Chờ xác nhận' ? `
                                <button class="btn btn-success btn-sm me-1" onclick="updateOrderStatus(${index}, 'Đã duyệt')">Duyệt</button>
                                <button class="btn btn-danger btn-sm" onclick="updateOrderStatus(${index}, 'Đã hủy')">Hủy</button>
                            ` : `<span class="text-muted fst-italic">Đã xử lý</span>`}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            document.getElementById('total-orders').innerText = activeOrdersCount;
            document.getElementById('total-revenue').innerText = revenue.toLocaleString('vi-VN') + ' đ';
        }

        function updateOrderStatus(index, newStatus) {
            orders[index].status = newStatus;
            renderOrders(); 
            if(newStatus === 'Đã duyệt') {
                alert('Đã duyệt đơn hàng thành công!');
            } else {
                alert('Đã hủy đơn hàng!');
            }
        }

        window.onload = renderOrders;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
