<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - PhoneStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold">📱 PhoneStore</h3>
            <p class="text-muted">Đăng nhập để tiếp tục</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng Nhập</button>
            
            <div class="text-center mt-3">
                <span>Chưa có tài khoản? <a href="register.html" class="text-decoration-none">Đăng ký ngay</a></span>
                <hr>
                <a href="index.html" class="text-decoration-none text-secondary">🏠 Về trang chủ</a>
            </div>
        </form>
    </div>

   <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const result = await response.json();
            alert(result.message);
            
            if(result.status === 'success') {
                // Lưu thông tin vào trình duyệt
                localStorage.setItem('username', username);
                localStorage.setItem('userId', result.userId);
                localStorage.setItem('role', result.role);
                
                // Chuyển về trang chủ
                window.location.href = 'index.html';
            }
        } catch (error) {
            console.error('Lỗi:', error);
            alert('Không thể kết nối đến máy chủ!');
        }
    });
</script>
</body>
</html>
